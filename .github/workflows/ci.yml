name: CI

# Corre a suite completa da app em cada push/PR para main.
# (Os workflows em operacao-semanal/.github/ são do template Shopify e o GitHub
#  ignora-os — só lê .github/workflows na raiz do repositório.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operacao-semanal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: operacao-semanal/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      # Cria prisma/dev.sqlite com o schema — os testes de serviços/seed copiam
      # esta BD para uma cópia descartável.
      - name: Preparar base de dados de teste
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
